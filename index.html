<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好友德州撲克</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#f7f5eb;font:16px system-ui,'Noto Sans TC',sans-serif}main{max-width:980px;margin:auto;padding:18px}h1{text-align:center;color:#eac477}.panel{background:#172537;border:1px solid #31445a;border-radius:18px;padding:20px;margin:15px 0}input{background:#0e1a2b;border:1px solid #5b7086;color:white;border-radius:9px;padding:12px;font-size:16px;max-width:100%}button{background:#d5aa56;border:0;border-radius:9px;padding:12px 15px;font-size:15px;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.3;cursor:not-allowed}.secondary{background:#39536b;color:white}.danger{background:#a83d49;color:white}.table{background:radial-gradient(ellipse,#16694d,#074632);border:13px solid #64472b;border-radius:130px;min-height:410px;padding:24px 14px;box-shadow:0 0 0 5px #263544;display:flex;flex-direction:column;justify-content:space-between;gap:24px}.seats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}.seat{text-align:center;background:#092c26bb;border:1px solid #ffffff33;border-radius:12px;padding:10px;min-width:125px;max-width:190px;flex:1}.turn{outline:3px solid #f8d66e}.muted{opacity:.5}.cards{display:flex;justify-content:center;gap:5px;margin:8px 0}.card{display:inline-flex;align-items:center;justify-content:center;background:#fffaf0;color:#121b26;border-radius:6px;width:42px;height:60px;font-size:21px;font-weight:800;box-shadow:0 2px 4px #0005}.red{color:#d43142}.back{background:repeating-linear-gradient(45deg,#233d79,#233d79 5px,#4769ad 5px,#4769ad 10px);border:3px solid #eee}.center{text-align:center}.pot{font-size:22px;color:#ffe28b;font-weight:800}.controls{text-align:center}.controls input{width:110px}.log{font-size:13px;max-height:160px;overflow:auto;color:#cad6dc}#game{display:none}#message{color:#ffd788;min-height:24px}small{color:#b9c7ce}@media(max-width:600px){.table{border-radius:65px;padding:12px 5px}.seat{min-width:90px;padding:5px;font-size:12px}.card{width:32px;height:45px;font-size:17px}.cards{gap:2px}.panel{padding:12px}}</style><main><h1>♠ 好友德州撲克</h1><section class="panel" id="lobby"><h2>建立或加入私人牌桌</h2><p>每人 2,000 虛擬籌碼，最多 6 人。房主可以開始下一局。</p><input id="name" placeholder="你的暱稱" maxlength="16"> <input id="code" placeholder="房間代碼（新房間留空）" maxlength="8"><p><button onclick="join()">進入牌桌</button></p><small>朋友可透過房間邀請連結加入，無須註冊。</small></section><section id="game"><div class="panel"><b>房間：<span id="room"></span></b> <button class="secondary" onclick="copyInvite()">複製邀請連結</button> <button id="start" onclick="socket.emit('start')">開始新一局</button><div id="message"></div></div><div class="table"><div id="seats" class="seats"></div><div class="center"><div id="phase"></div><div class="pot" id="pot"></div><div class="cards" id="board"></div></div><div class="center"><div>你的手牌</div><div class="cards" id="hand"></div></div></div><div class="panel controls"><div id="status"></div><button id="fold" class="danger" onclick="act('fold')">棄牌 Fold</button><button id="check" class="secondary" onclick="act('check')">過牌 Check</button><button id="call" onclick="act('call')">跟注 Call</button><input type="number" id="raiseAmount" min="20" step="10"><button id="raise" onclick="act('raise')">加注 Raise</button><button id="allin" onclick="act('allin')">All-in</button></div><div class="panel"><h3>牌局紀錄</h3><div class="log" id="log"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();let state=null;const $=id=>document.getElementById(id);$('code').value=new URLSearchParams(location.search).get('room')||'';function msg(t){$('message').textContent=t}function join(){socket.emit('join',{code:$('code').value,name:$('name').value},r=>{if(r.error){alert(r.error);return}history.replaceState({},'',`?room=${r.code}`);$('lobby').style.display='none';$('game').style.display='block'})}function copyInvite(){let url=location.origin+'/?room='+state.code;navigator.clipboard?.writeText(url).then(()=>msg('已複製邀請連結')).catch(()=>prompt('複製以下連結',url))}function act(type){socket.emit('action',{type,amount:$('raiseAmount').value},r=>{if(r.error)msg(r.error);else msg('')})}function card(c){if(!c)return '<span class="card back"></span>';let s={s:'♠',h:'♥',d:'♦',c:'♣'}[c[1]];return `<span class="card ${'hd'.includes(c[1])?'red':''}">${c[0]==='T'?'10':c[0]}${s}</span>`}socket.on('state',s=>{state=s;$('room').textContent=s.code;$('phase').textContent={waiting:'等待玩家',preflop:'翻牌前 Preflop',flop:'翻牌 Flop',turn:'轉牌 Turn',river:'河牌 River',showdown:'攤牌 Showdown'}[s.phase];$('pot').textContent='底池 '+s.pot;$('board').innerHTML=s.board.map(card).join('')||'<small>等待公共牌</small>';$('seats').innerHTML=s.players.map((p,i)=>`<div class="seat ${i===s.turn?'turn':''} ${p.folded&&p.inHand?'muted':''}"><b>${p.name}${p.id===s.you?'（你）':''}${i===s.button?' · D':''}</b><div>籌碼 ${p.stack}</div><div>本輪 ${p.bet}${p.allin?' · All-in':''}</div><div class="cards">${p.inHand?(p.cards||[null,null]).map(card).join(''):''}</div><small>${!p.connected?'已離線':p.folded&&p.inHand?'已棄牌':''}</small></div>`).join('');let me=s.players.find(p=>p.id===s.you);$('hand').innerHTML=(me?.cards||[]).map(card).join('');let mine=s.turn===me?.seat&&['preflop','flop','turn','river'].includes(s.phase),toCall=Math.max(0,s.bet-(me?.bet||0));$('status').textContent=mine?`輪到你｜需跟注 ${toCall}｜最低加注總額 ${s.bet+s.minRaise}`:'等待其他玩家行動';for(let id of ['fold','check','call','raise','allin'])$(id).disabled=!mine;$('check').disabled=!mine||toCall>0;$('call').disabled=!mine||toCall===0;$('call').textContent=`跟注 ${Math.min(toCall,me?.stack||0)}`;$('raiseAmount').min=s.bet+s.minRaise;$('raiseAmount').max=(me?.stack||0)+(me?.bet||0);if(document.activeElement!==$('raiseAmount'))$('raiseAmount').value=Math.min(Number($('raiseAmount').max),Number($('raiseAmount').min));$('start').style.display=s.host===s.you&&['waiting','showdown'].includes(s.phase)?'inline-block':'none';$('log').innerHTML=s.log.map(x=>`<div>${x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('')});socket.on('disconnect',()=>msg('連線中斷，請重新整理頁面加入房間'));</script></html>
